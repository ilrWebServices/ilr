id: employee_title_request
title: 'Request a title update'
description: ''
categories: {  }
elements: |-
  message:
    '#type': webform_markup
    '#markup': '<p>Titles are officially managed and imported from Workday. If you would like an update to your title, or to add an additional title, please use this form and the communications team will relay your message to HR.</p>'
  your_name:
    '#type': textfield
    '#title': 'Your name'
    '#disabled': true
    '#required': true
    '#default_value': '[current-user:field_common_name]'
    '#access_create_roles':
      - authenticated
  title:
    '#type': textfield
    '#title': Title
    '#required': true
  department:
    '#type': entity_autocomplete
    '#title': Department
    '#required': true
    '#target_type': taxonomy_term
    '#selection_handler': 'default:taxonomy_term'
    '#selection_settings':
      target_bundles:
        organizational_units: organizational_units
      sort:
        field: name
        direction: asc
      auto_create: false
      auto_create_bundle: ''
  type_of_request:
    '#type': radios
    '#title': 'What kind of title change are you requesting?'
    '#options':
      'Adding a title': 'Adding a title'
      'Updating a title': 'Updating a title'
      'Removing a title': 'Removing a title'
    '#required': true
  pid:
    '#type': hidden
    '#title': 'Employee Persona Id'
    '#default_value': 'current-page:query:pid'
    '#prepopulate': true
  status:
    '#type': select
    '#title': Status
    '#description': '<p>Please indicate the current status of this request, so that other members on the communications team know if HR has been contacted.</p>'
    '#options':
      New: New
      'In process': 'In process'
      Approved: Approved
      Denied: Denied
    '#default_value': New
    '#access_create_roles':
      - employee_admin
